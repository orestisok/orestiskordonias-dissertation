<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#00786f" />
		<title>Offline - CivicScan</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
				font-family: system-ui, sans-serif;
				background: #ffffff;
				color: #1c1917;
				text-align: center;
			}
			.brand {
				font-size: 1.125rem;
				font-weight: 600;
				color: #00786f;
			}
			h1 {
				margin: 1.5rem 0 0.5rem;
				font-size: 1.5rem;
			}
			p {
				margin: 0 0 1.5rem;
				color: #57534e;
			}
			button {
				border: 0;
				border-radius: 0.5rem;
				padding: 0.625rem 1.25rem;
				font: inherit;
				font-weight: 500;
				background: #00786f;
				color: #ffffff;
				cursor: pointer;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background: #1c1917;
					color: #fafaf9;
				}
				p {
					color: #a8a29e;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<div class="brand">CivicScan</div>
			<h1>You're offline</h1>
			<p>Check your connection and try again.</p>
			<button type="button" onclick="location.reload()">Retry</button>
		</main>
	</body>
</html>
